:root {

  --orange: #ff5c00; --orange-hover: #e85400; --orange-ink: #500304; --yellow: #e6ba29; --note: #f6d561; --note-ink: #3a2b00;
  --good: #4f7d1f; --bad: #b3261e;
  --ticker-ink: #cac7bf; --foot: #1a1a19; --foot-muted: #6c6962; --foot-soft: #8b887f; --foot-pill: #282827;
  --f-display: "Inter Tight", "Heebo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-sans: "Inter", "Heebo", "Helvetica Neue", Arial, system-ui, -apple-system, sans-serif;

      menuTaxItems: [['העסק', 'ה-₪70,000 וכמה לשים בצד'], ['שנה אחרי שנה', 'הכנסות ומס, 2023 עד 2026'], ['משימות', 'דדליינים ושאלות פתוחות'], ['מקורות', 'מאיזה קובץ הגיע כל מספר']],
      logos: ['מגדל', 'ילין לפידות', 'הפניקס', 'Interactive Israel', 'Mixtiles', 'רשות המסים', 'ביטוח לאומי', 'בנק ישראל'],
      cards: {
        incoming: ['₪70,000 בדרך', r => `ברוטו, מהעסק. עוד לא שולם. לשמור כ-${r} למס.`],
        liquid: ['נזיל עכשיו', 'מזומן, דולרים, IBKR וגמל להשקעה', 'תוך ימים'],
        pension: ['פנסיה בגיל 67', '/חודש', 'תחזית של אגם לידרס', 'אם ההפקדות יימשכו'],
        nvda: [p => `NVDA הוא ${p}% מתיק ה-IBKR`, (a, b) => `${a} מתוך ${b} בצילום הפוזיציות.`],
        july: ['נטו ביולי', 'שכר בסיס ₪31,000', 'מס שולי 35%'],
        inactive: [n => `${n} חשבונות לא פעילים`, v => `בילין לפידות, ואף אחד לא מפקיד אליהם. ${v} בפירוט האחרון, מיולי.`],
        debts: ['הלוואות וחובות', 'אין הלוואות. המס ל-2024 ול-2025 שולם.', 'לפי מיילי התשלום']
      },
      foot: ['שווי נקי', 'נזיל', 'פנסיה', 'IBKR', 'חובות']
    }
  };
  const t = () => T[state.lang];

  // ---------- numbers ----------
  D.holdings.forEach(h => { if (h.usdOnly) { h.usd = h.usdOnly; h.ils = h.usdOnly * FX; } });
  const GC = { cash: 'var(--blue)', invest: 'var(--purple)', savings: 'var(--yellow)', pension: 'var(--ink)', family: 'var(--pill-hover)' };
  const sum = arr => arr.reduce((a, h) => a + h.ils, 0);
  const total = sum(D.holdings);
  const liquid = sum(D.holdings.filter(h => h.liquidity === 'liquid'));
  const byGroup = Object.keys(GC).map(k => ({ k, c: GC[k], v: sum(D.holdings.filter(h => h.group === k)) }));
  const G = k => byGroup.find(g => g.k === k);
  const iso = s => '⁦' + s + '⁩';   // keep numbers left-to-right inside Hebrew text
  const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const ils = v => iso('₪' + nf.format(Math.round(v)));
  const usd = v => iso('$' + nf.format(Math.round(v)));
  const money = (v, cur = state.cur) => cur === 'USD' ? usd(v / FX) : ils(v);
  const other = v => state.cur === 'USD' ? ils(v) : usd(v / FX);
  const short = (v, cur = state.cur) => {
    const x = cur === 'USD' ? v / FX : v, s = cur === 'USD' ? '$' : '₪';
    if (x >= 1e6) return iso(s + (x / 1e6).toFixed(2).replace(/0$/, '') + 'M');
    if (x >= 1e4) return iso(s + Math.round(x / 1e3) + 'K');
    return iso(s + nf.format(Math.round(x)));
  };
  const fmtDate = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return state.lang === 'he' ? d.toLocaleDateString('en-GB').replace(/\//g, '/') : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const ibkr = D.holdings.find(h => h.id === 'ibkr');
  const nv = D.positions.find(p => p.ticker === 'NVDA');
  const res = D.business.reserve;

  // ---------- static ----------
  const paintStatic = () => {
    const root = document.documentElement;
    root.lang = state.lang; root.dir = state.lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t()[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t()[el.dataset.i18nHtml]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t()[el.dataset.i18nAria]); });
    $('lang').dataset.lang = state.lang;
    $('lang').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.setLang === state.lang));
    $('filters').setAttribute('aria-label', t().filterAria);
    $('mmenu').setAttribute('aria-label', t().menuAria);
    $('asOfTxt').textContent = t().asOfPill(fmtDate(D.asOf));
    $('deadlineTxt').textContent = t().deadline;
  };

  const paintTicker = () => {
    const k = t().tick;
    const rows = [[k.net, ils(total)], [k.liquid, ils(liquid)], [k.pension, ils(G('pension').v)], [k.savings, ils(G('savings').v)],
      ['Interactive Israel', iso('$' + ibkr.usd.toLocaleString('en-US', { minimumFractionDigits: 2 }))], [k.fx, FX.toFixed(3)], [k.incoming, k.incomingV], [k.next, k.nextV],
      [k.july, ils(D.salary.julyNet)], [k.debts, iso('₪0')], [k.p67, ils(D.projection67.monthlyPension) + k.p67v]];
    const run = '<ul class="run">' + rows.map(([a, b]) => `<li class="item">${esc(a)} <b>${esc(b)}</b></li><li class="sep" aria-hidden="true"></li>`).join('') + '</ul>';
    $('track').innerHTML = run + run.replace('<ul class="run">', '<ul class="run" aria-hidden="true">');
  };

  const paintMenus = () => {
    const mk = (id, items, hrefs, colors) => { $(id).innerHTML = items.map(([a, b], i) => `<a class="mitem" href="${hrefs[i]}" style="--i:${i};--c:${colors[i]}"><span class="ic"><i></i></span><span class="t">${esc(a)}</span><span class="b">${esc(b)}</span></a>`).join(''); };
    mk('m-money', t().menuMoneyItems, ['#holdings', '#holdings', '#holdings', '#holdings', '#holdings', '#highlights'], [GC.cash, GC.invest, GC.savings, GC.pension, GC.family, 'var(--orange)']);
    mk('m-tax', t().menuTaxItems, ['#business', '#years', '#todo', '#sources'], ['var(--orange)', 'var(--ink)', 'var(--purple)', 'var(--blue)']);
    const lg = t().logos.map(n => `<span class="logo"><span class="wm">${esc(n)}</span></span>`).join('');
    $('logos').innerHTML = lg + lg;
  };

  // ---------- hero ----------
  const paintTotal = () => {
    $('amt').innerHTML = `<span class="approx">≈</span>${money(total)}`;
    $('alt').textContent = `${t().about} ${other(total)} · ${FX} ₪ ${t().perDollar}`;
    $('tbar').innerHTML = byGroup.map(g => `<i class="seg" style="flex:${g.v};background:${g.c}" title="${esc(t().groups[g.k])} ${money(g.v)}"></i>`).join('');
    $('legend').innerHTML = byGroup.map(g => `<span><i style="background:${g.c}"></i>${esc(t().groups[g.k])} <b>${short(g.v)}</b></span>`).join('');
    $('tmeta').innerHTML = t().tmeta(money(liquid), money(total - G('pension').v));
    const label = state.cur === 'USD' ? t().showIls : t().showUsd;
    $('curBtn').textContent = label; $('amtBtn').title = label;
  };

  // ---------- canvas ----------
  const paintCards = () => {
    const c = t().cards, nvPct = Math.round(nv.usd / D.positionsTotalUsd * 100), nIn = D.inactiveAccounts.count;
    const list = [
      { k: 'note', cls: 'yellow', x: 150, y: 96, w: 250, r: -4, wide: true, a: c.incoming[0], b: c.incoming[1](ils(res.total)) },
      { k: 'photo', x: 450, y: 56, w: 240, r: 3, lab: c.liquid[0], fig: short(liquid), tag: c.liquid[1], sub: c.liquid[2] },
      { k: 'photo', x: 750, y: 118, w: 240, r: -2, lab: c.pension[0], fig: `${ils(D.projection67.monthlyPension)}<s>${c.pension[1]}</s>`, tag: c.pension[2], sub: c.pension[3] },
      { k: 'note', cls: 'blue', x: 1060, y: 72, w: 250, r: 4, a: c.nvda[0](nvPct), b: c.nvda[1](usd(nv.usd), usd(D.positionsTotalUsd)) },
      { k: 'photo', x: 110, y: 330, w: 230, r: 2, lab: c.july[0], fig: ils(D.salary.julyNet), tag: c.july[1], sub: c.july[2] },
      { k: 'note', cls: 'purple', x: 420, y: 352, w: 240, r: -3, a: c.inactive[0](nIn), b: c.inactive[1](ils(D.inactiveAccounts.ils)) },
      { k: 'photo', x: 1110, y: 330, w: 230, r: -3, lab: c.debts[0], fig: ils(0), tag: c.debts[1], sub: c.debts[2] }
    ];
    $('cards').innerHTML = list.map(o => {
      const st = `--x:${o.x};--y:${o.y};--w:${o.w};--r:${o.r}deg`;
      if (o.k === 'note') return `<div class="ccard" style="${st}"><span class="note hp-squircle ${o.cls}">${esc(o.a)}<small>${esc(o.b)}</small></span></div>`;
      return `<div class="ccard" style="${st}"><span class="photo hp-squircle"><span class="fig"><small>${esc(o.lab)}</small><strong>${o.fig}</strong></span><span class="ptag">${esc(o.tag)} <s>${esc(o.sub)}</s></span></span></div>`;
    }).join('');
  };

  // ---------- holdings ----------
  const LIQC = { liquid: 't-in', terms: 't-target', retire: 't-out', owed: 't-wait' };
  const donut = (share, c) => {
    const r = 30, C = 2 * Math.PI * r, len = Math.max(share * C, 1.5);
    return `<svg class="donut" viewBox="0 0 80 80" aria-hidden="true"><circle class="trk" cx="40" cy="40" r="${r}" stroke-width="7"/><circle class="arc" cx="40" cy="40" r="${r}" stroke-width="7" stroke-dasharray="${len} ${C}" transform="rotate(-90 40 40)" style="--c:${c}"/><text x="40" y="42" text-anchor="middle">${(share * 100).toFixed(1)}%</text><text class="s" x="40" y="52" text-anchor="middle">${esc(t().ofNet)}</text></svg>`;
  };
  const paintFilters = () => {
    const opts = [{ k: 'all', v: total }].concat(byGroup);
    $('filters').innerHTML = opts.map(o => `<button class="mini hp-squircle" type="button" data-f="${o.k}" aria-pressed="${state.filter === o.k}">${o.c ? `<i style="--c:${o.c}"></i>` : ''}${esc(o.k === 'all' ? t().all : t().groups[o.k])} <span>${short(o.v)}</span></button>`).join('');
  };
  const paintGrid = animate => {
    const list = D.holdings.filter(h => state.filter === 'all' || h.group === state.filter).sort((a, b) => b.ils - a.ils);
    const pc = ['var(--purple)', 'var(--blue)', 'var(--yellow)', 'var(--orange)', 'var(--ink)', 'var(--rule)'];
    $('grid').innerHTML = list.map((h, i) => {
      const alt = h.usdOnly ? iso('$' + h.usd.toLocaleString('en-US', { minimumFractionDigits: 2 })) : other(h.ils);
      const stack = h.id === 'ibkr' ? `<span class="stack">${D.positions.map((p, j) => `<i style="flex:${p.usd};background:${pc[j]}" title="${p.ticker} $${nf.format(p.usd)}"></i>`).join('')}</span>` : '';
      const right = h.ret12 ? `<span class="up">${iso('+' + h.ret12.toFixed(2) + '%')} <span>${esc(t().ret)}</span></span>` : (stack || `<span>${esc(L(h.source))}</span>`);
      return `<article class="pcard${animate ? ' hopin' : ''}" style="--i:${i}">
        <div class="well hp-squircle">${donut(h.ils / total, GC[h.group])}<span class="tag ${LIQC[h.liquidity]}">${esc(t().liq[h.liquidity])}</span>${h.flag ? `<span class="off">${esc(t().inactive)}</span>` : ''}<span class="basis">${esc(t().basis[h.basis])}</span></div>
        <div class="pmeta"><span class="pstore">${esc(L(h.institution))}</span><h3 class="pname">${esc(L(h.name))}</h3><p class="pvar">${esc(L(h.detail))}</p></div>
        <div class="prices"><span class="price">${money(h.ils)}</span><span class="was">${alt}</span></div>
        <p class="pnote">${esc(L(h.note))}</p>
        <div class="pfoot"><span>${h.asOf ? esc(t().asOf + (state.lang === 'he' ? '' : ' ') + fmtDate(h.asOf)) : esc(t().noDate)}</span>${right}</div>
      </article>`;
    }).join('');
  };
  $('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; state.filter = b.dataset.f; paintFilters(); paintGrid(true); });

  // ---------- business ----------
  const paintBiz = () => {
    const B = D.business, x = t(), r2 = x.b2rows(res.deductionPct), used = B.expectedGross;
    $('biz').innerHTML = `
      <article class="bcard hp-squircle"><span class="tag t-wait">${esc(x.b1tag)}</span>
        <span class="pstore">${esc(x.b1lab)}</span><span class="price">${money(B.expectedGross)}</span>
        <p class="pnote">${esc(x.b1note)}</p>
        <dl class="calc"><div><dt>${esc(x.b1rows[0])}</dt><dd>${esc(x.b1rows[1])}</dd></div><div><dt>${esc(x.b1rows[2])}</dt><dd>${esc(x.b1rows[3])}</dd></div><div><dt>${esc(x.b1rows[4])}</dt><dd>${money(B.income2025)}</dd></div></dl>
      </article>
      <article class="bcard hp-squircle"><span class="tag t-target float">${esc(x.b2tag)}</span>
        <span class="pstore">${esc(x.b2lab)}</span><span class="price"><span class="approx">≈</span>${money(res.total)}</span>
        <dl class="calc">
          <div><dt>${esc(r2[0])}</dt><dd>${money(res.taxable)}</dd></div>
          <div><dt>${esc(r2[1])}</dt><dd>${money(res.incomeTax)}</dd></div>
          <div><dt>${esc(r2[2])}</dt><dd>${money(res.niHealth)}</dd></div>
          <div class="tot"><dt>${esc(r2[3])}</dt><dd>${money(res.net)}</dd></div>
        </dl>
        <p class="pnote">${esc(x.b2note)} ${esc(L(res.assumptions))}</p>
      </article>
      <article class="bcard hp-squircle"><span class="tag t-in">${esc(x.b3tag)}</span>
        <span class="pstore">${esc(x.b3lab)}</span><span class="price">${money(B.ceiling - used)}</span>
        <p class="pnote">${esc(x.b3note(money(used), money(B.ceiling)))}</p>
        <div class="meter" aria-hidden="true"><i style="width:${used / B.ceiling * 100}%;background:var(--blue)"></i></div>
        <p class="pnote">${esc(x.b3note2)}</p>
      </article>`;
  };

  // ---------- years ----------
  const paintYear = dir => {
    const y = D.years[state.year], blocks = [$('tBy'), $('tQuote'), $('tStats')];
    const paint = () => {
      $('tBy').innerHTML = `<b>${y.year}</b><span>${esc(L(y.label))}</span>`;
      $('tQuote').textContent = L(y.text);
      $('tStats').innerHTML = `<b>${short(y.stat, 'ILS')}</b><span>${esc(L(y.statLabel))}</span>`;
      $('count').textContent = String(state.year + 1).padStart(2, '0') + '/' + String(D.years.length).padStart(2, '0');
    };
    if (!dir) { paint(); return; }
    blocks.forEach(b => { b.style.setProperty('--dir', dir * (state.lang === 'he' ? -1 : 1)); b.dataset.phase = 'out'; });
    setTimeout(() => { paint(); blocks.forEach(b => b.dataset.phase = 'pre'); void blocks[0].offsetWidth; blocks.forEach(b => b.dataset.phase = 'in'); }, 220);
  };
  $('prev').addEventListener('click', () => { state.year = (state.year - 1 + D.years.length) % D.years.length; paintYear(-1); });
  $('next').addEventListener('click', () => { state.year = (state.year + 1) % D.years.length; paintYear(1); });

  // ---------- to-do ----------
  let done = {};
  try { done = JSON.parse(store.get('mf-done') || '{}') || {}; } catch (e) {}
  const paintTodo = () => {
    const open = D.todo.filter(x => !done[x.id]), first = open[0];
    $('nextWhen').textContent = first ? L(first.when) : t().allDone;
    $('nextWhat').textContent = first ? L(first.title) : t().nothingOpen;
    $('todoPill').textContent = t().todoPill(open.length);
    $('wsteps').innerHTML = t().steps(open.length, open.filter(x => x.kind === 'urgent').length, D.todo.length - open.length);
    $('todoList').innerHTML = D.todo.map(x => `<li class="hp-squircle${done[x.id] ? ' done' : ''}"><input type="checkbox" id="td-${x.id}" data-id="${x.id}"${done[x.id] ? ' checked' : ''}><span class="when tag ${x.kind === 'urgent' ? 't-target' : x.kind === 'monthly' ? 't-in' : 't-wait'}">${esc(L(x.when))}</span><label for="td-${x.id}"><b>${esc(L(x.title))}</b><span>${esc(L(x.detail))}</span></label></li>`).join('');
  };
  $('todoList').addEventListener('change', e => {
    const id = e.target.dataset.id; if (!id) return;
    if (e.target.checked) done[id] = 1; else delete done[id];
    $('wmsg').textContent = store.set('mf-done', JSON.stringify(done)) ? (e.target.checked ? t().ticked : t().unticked) : t().noSave;
    paintTodo();
  });

  // ---------- footer ----------
  const paintFoot = () => {
    const f = t().foot;
    $('fstack').innerHTML = [[f[0], short(total, 'ILS'), -8, 10], [f[1], short(liquid, 'ILS'), 5, -6], [f[2], short(G('pension').v, 'ILS'), -3, 4], [f[3], iso('$36.9K'), 7, -2], [f[4], iso('₪0'), -5, 8]]
      .map(([l, v, r, y]) => `<span class="photo hp-squircle" style="--r:${r}deg;--y:${y}px"><span class="fig"><small>${esc(l)}</small><strong>${v}</strong></span></span>`).join('');
    $('srcList').innerHTML = t().sources.map(s => `<p>${esc(s)}</p>`).join('');
    $('notCounted').innerHTML = D.notCounted.map(n => `<p>${esc(L(n))}</p>`).join('');
    $('legal1').textContent = t().legal1(fmtDate(D.asOf), FX, fmtDate(D.fx.date));
  };

  // ---------- chrome ----------
  const groups = [...document.querySelectorAll('.group')];
  const closeAll = except => groups.forEach(g => { if (g === except) return; g.querySelector('.pill-group').setAttribute('aria-expanded', 'false'); g.querySelector('.panel').removeAttribute('data-open'); });
  groups.forEach(g => {
    const b = g.querySelector('.pill-group'), p = g.querySelector('.panel');
    b.addEventListener('click', e => { e.stopPropagation(); const open = b.getAttribute('aria-expanded') !== 'true'; closeAll(g); b.setAttribute('aria-expanded', open); open ? p.setAttribute('data-open', '') : p.removeAttribute('data-open'); });
    p.addEventListener('click', () => closeAll());
  });
  document.addEventListener('click', () => closeAll());
  const setMenu = open => { $('mmenu').hidden = !open; $('burger').setAttribute('aria-expanded', open); open ? document.documentElement.setAttribute('data-hp-menu-open', '') : document.documentElement.removeAttribute('data-hp-menu-open'); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAll(); setMenu(false); } });
  $('burger').addEventListener('click', () => setMenu($('mmenu').hidden));
  $('mmenu').addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
  const onScroll = () => window.scrollY > 8 ? document.documentElement.setAttribute('data-hp-scrolled', '') : document.documentElement.removeAttribute('data-hp-scrolled');
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  (() => { let s = ''; const S = 72, gap = 8; for (let y = 0; y < 660; y += S + gap) for (let x = 0; x < 1440; x += S + gap) s += `<rect class="tile" x="${x}" y="${y}" width="${S}" height="${S}" rx="14"/>`; $('floor').innerHTML = s; })();

  const paintAll = animate => { paintStatic(); paintTicker(); paintMenus(); paintTotal(); paintCards(); paintFilters(); paintGrid(animate); paintBiz(); paintYear(0); paintTodo(); paintFoot(); };
  const setCur = c => { state.cur = c; store.set('mf-cur', c); paintTotal(); paintCards(); paintFilters(); paintGrid(false); paintBiz(); };
  $('curBtn').addEventListener('click', () => setCur(state.cur === 'USD' ? 'ILS' : 'USD'));
  $('amtBtn').addEventListener('click', () => setCur(state.cur === 'USD' ? 'ILS' : 'USD'));
  $('lang').addEventListener('click', e => { const b = e.target.closest('[data-set-lang]'); if (!b || b.dataset.setLang === state.lang) return; state.lang = b.dataset.setLang; store.set('mf-lang', state.lang); $('wmsg').textContent = ''; paintAll(false); });

  paintAll(true);
})();
</script>

</body>
</html>
